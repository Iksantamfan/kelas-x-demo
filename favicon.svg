<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Bar kanan-atas -> kiri-bawah (di bawah): biru sedang ke biru tua -->
    <linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="-1" y1="89.8" x2="101" y2="10.2">
      <stop offset="0" stop-color="#0b4bfd"/>
      <stop offset="1" stop-color="#2e86f7"/>
    </linearGradient>
    <!-- Bar kiri-atas -> kanan-bawah (di atas): cyan terang ke biru tua -->
    <linearGradient id="gA" gradientUnits="userSpaceOnUse" x1="-1" y1="10.2" x2="101" y2="89.8">
      <stop offset="0" stop-color="#9cedff"/>
      <stop offset="0.45" stop-color="#31c4f8"/>
      <stop offset="1" stop-color="#0b5afc"/>
    </linearGradient>
  </defs>
  <!-- X KelasX: dua batang bersudut membulat, masing-masing 129 x 19, diputar +-38 derajat -->
  <rect x="-14.5" y="40.5" width="129" height="19" rx="9.5" fill="url(#gB)" transform="rotate(-38 50 50)"/>
  <rect x="-14.5" y="40.5" width="129" height="19" rx="9.5" fill="url(#gA)" transform="rotate(38 50 50)"/>
</svg>
