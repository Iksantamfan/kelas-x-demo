    <script>
      // Terapkan mode night sedini mungkin supaya tidak ada flash tema
      // terang saat load. Pilihan tersimpan di localStorage 'kelasx-tema'
      // ('terang' | 'gelap'); kalau belum pernah dipilih, ikut sistem.
      try {
        var t = localStorage.getItem('kelasx-tema')
        var gelap =
          t === 'gelap' ||
          (t !== 'terang' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.tema = gelap ? 'gelap' : 'terang'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', gelap ? '#0b1f26' : '#0f766e')
      } catch (e) {
        document.documentElement.dataset.tema = 'terang'
      }
    </script>
